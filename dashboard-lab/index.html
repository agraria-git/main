<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="">
  <meta name="author" content="">
  <title>main Dashboard</title>
  <!-- Custom fonts for this template-->
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link
    href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
    rel="stylesheet">
  <!-- Custom styles for this template-->
  <link href="css/style.css" rel="stylesheet">
  <link href="css/sb-admin-2.min.css" rel="stylesheet">
  <link href="https://leafletjs.com/atom.xml" type="application/atom+xml" rel="alternate"
    title="Leaflet Dev Blog Atom Feed">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400italic,700,300" rel="stylesheet" type="text/css">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
    rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.5.0.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

    defer="defer"></script>

  <script type="text/javascript" src="js/functions.js"></script>
  <script type="text/javascript" src="js/mqtt-service.js"></script>
  <script type="text/javascript" src="js/rosbridge-service.js"></script>

  <script type="text/javascript" src="http://static.robotwebtools.org/EventEmitter2/current/eventemitter2.min.js"></script>
  <script type="text/javascript" src="http://static.robotwebtools.org/roslibjs/current/roslib.min.js"></script>


</head>

<body id="page-top">
  <!-- Page Wrapper -->
  <div id="wrapper">
    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">
      <!-- Main Content -->
      <div id="content">


        <div class="header">
          <img class="logomain" src="img/main.png" alt="GMV. Innovating Solutions">
          <img class="logoGmv" src="img/logo_gmv.svg" alt="GMV. Innovating Solutions">
        </div>

        <!-- <div style="text-align: center;">
          <img src="img/main.png" style="float: left;">
          <img src="ruta-de-la-imagen-2.jpg" style="float: right;">
        </div> -->

        <!-- Begin Page Content -->
        <div class="container-fluid">
          <!-- Page Heading -->
          <div class="d-sm-flex align-items-center justify-content-between my-4">
            <h1 class="h3 mb-0 text-gray-800">Dashboard <img id="mqttStateImage" src="mqttDisconnected2.png" width="30" height="30" style="top: 90%;"></h1>
          </div>
          <!-- Content Row -->
          <div class="row">
            <div class="col-xl-8 col-lg-7"> <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary mr-2"
                id="reproducirRuta"> Reproducir </a> 
                <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary mr-2" id="guardaPunto"> Guardar Punto </a> 
                <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary mr-2" id="descarga"> Descargar </a>
                <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary mr-2" id="importa"> Importar </a> 
                Batería: <span id="percentage"></span>  Voltaje: <span id="voltage"></span><br>
              <input type="file" id="selectFiles" value="Import" hidden />
              <label for="selectFiles" class="mt-5 btn-sm btn-primary">Seleccionar Archivo</label>
              <span id="file-chosen">No se ha seleccionado archivo...</span>
            </div>
          </div>
          <!-- Content Row -->
          <div class="row">
            <!-- Area Chart -->
            <div class="col-lg-6">
              <div class="card my-4">
                <!-- Card Header - Dropdown -->
                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                  <h6 class="m-0 font-weight-bold text-primary">Mapa</h6>
                  <input id="addRoute" onclick="addCustomizedRoute();" type="button" class="btn-sm btn-primary btn-header" value="Añadir ruta" />
                  <input id="centerMap" onclick="centerMap();" type="button" class="btn-sm btn-primary btn-header" style="right:110px " value="Centrar" />
                  <input id="clearRoute" onclick="clearRoute();" type="button" class="btn-sm btn-primary btn-header" style="right:180px " value="Limpiar ruta" />
                  <input id="clearTrace" onclick="clearTrace();" type="button" class="btn-sm btn-primary btn-header" style="right:280px " value="Limpiar rastro" />
                  
                </div>
                <!-- Card Body -->
                <div class="card-body">

                  <div id="map" class="mb-4 map map-home" style="height: 480px"></div>


                  <div class="menu" id="missionsMenu">
                    <div class="menu-item" id="sem"><i class="glyphicon glyphicon-file"></i>Semáforo</div>
                    <div class="menu-item" id="foto"><i class="glyphicon glyphicon-file"></i>Tomar Foto</div>
                    <div class="menu-item" id="entrega"><i class="glyphicon glyphicon-file"></i>Entrega de paquete</div>
                    <div class="menu-item" id="para"><i class="glyphicon glyphicon-file"></i>Parada</div>
                    <div class="menu-item" id="delmis"><i class="glyphicon glyphicon-file"></i>Quitar misión</div>
                  </div>

                </div>
              </div>
            </div>


            <div class="col-lg-6">
              <div class="card my-4">
                <!-- Card Header - Dropdown -->
                <div class="tab">
                  <button class="tablinks" onclick="tagsControl(event, 'Logs')" id="defaultOpen">Logs</button>
                  <button class="tablinks" onclick="tagsControl(event, 'Params')">Parámetros</button>
                  <button class="tablinks" onclick="tagsControl(event, 'Camera')">Cámara</button>

                </div>
                <div id="Logs" class="tabcontent">
                  <input id="addRoute" onclick="clearLogs();" type="button" class="btn-sm btn-primary btn-header" style="top:11px" value="Limpiar Logs" />
                  <div class="card-body card-youtube">
                    <div class="logScrollBox" id="scrollID">
                    </div>
                  </div>
                </div>
                
                <div id="Camera" class="tabcontent">
                  <img name="main" id="main" border="0" width="640" height="480" src="http://10.8.0.111:8081/video">
                  <div class="control-panel">
                    <a href="javascript:void(0);" class="d-none d-sm-inline-block btn btn-sm btn-primary" id="left" > <i class="fas fa-chevron-left"></i> </a>
                    <a href="javascript:void(0);" class="d-none d-sm-inline-block btn btn-sm btn-primary" id="up"> <i class="fas fa-chevron-up"></i> </a>
                    <a href="javascript:void(0);" class="d-none d-sm-inline-block btn btn-sm btn-primary" id="down" > <i class="fas fa-chevron-down"></i> </a>
                    <a href="javascript:void(0);" class="d-none d-sm-inline-block btn btn-sm btn-primary" id="right" > <i class="fas fa-chevron-right"></i> </a>
                    <a href="javascript:void(0);" class="d-none d-sm-inline-block btn btn-sm btn-primary" id="stop" > <i class="fas fa-circle"></i> </a>
                    <!-- <img id="mqttStateImage" src="img/panTiltKO.png" width="30" height="30" style="top: 90%;"> -->
                    <img id="panTiltState" class="panTilt" src="img/panTiltOK.png" width="30">
                    <style>
                      #stop {
                        position: absolute;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                      }
                    </style>
                  </div>
                </div>

                <div id="Params" class="tabcontent">
                  <input id="getParams" onclick="getParams();" type="button" class="btn-sm btn-primary btn-header" style="top:11px" value="Descargar Parámetros" />
                  <input id="setParams" onclick="setParams();" type="button" class="btn-sm btn-primary btn-header" style="top:11px ; right:180px" value="Subir Parámetros"/>
                  <!-- <input id="cleanParams" onclick="cleanParams();" type="button" class="btn-sm btn-primary btn-header" style="top:11px ; right:320px" value="Limpiar Parámetros"/> -->
                  <div class="card-body card-youtube">
                      <div class="paramScrollBox" id="paramsID">
                        <p class="scrollParam"> Parámetros configurables:</p>
                        <ul style="list-style-type:square">
                          <li>
                            <div class="scrollParam">
                              <label class="scrollParam" for="velocity">Velocidad del robot:</label>
                              <input class="scrollParam" id="velocity" name="username" type="text"  />
                            </div>
                          </li>
                          <li>
                            <div class="scrollParam">
                              <label class="scrollParam" for="automaticMode">Modo Automático:</label>
                              <input class="scrollParam" id="automaticMode" name="username" type="text"  />
                            </div>
                          </li>
                        </ul>
                      </div>
                  </div>
                </div>
                
        
        
              </div>
            </div>
        
          
          </div>
          
        </div>
        
        <!-- /.container-fluid -->
      </div>
      <!-- End of Main Content -->
      <!-- Footer -->
      <footer class="sticky-footer">
        <div class="container my-auto">
          <div class="copyright text-center my-auto"> <span>Copyright © GMV</span>
          </div>
        </div>
      </footer>
      <!-- End of Footer -->
    </div>
    <!-- End of Content Wrapper -->
  </div>
  <!-- End of Page Wrapper -->
  <!-- Scroll to Top Button--> <a class="scroll-to-top rounded" href="#page-top">
  </a>
  <!-- Bootstrap core JavaScript-->
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <!-- Core plugin JavaScript-->
  <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
  <!-- Custom scripts for all pages-->
  <script src="js/sb-admin-2.min.js"></script>
  <!-- Page level plugins -->
  <script src="vendor/chart.js/Chart.min.js"></script>
</body>

</html>


<script>
  const selecttheFiles = document.getElementById('selectFiles');
  const fileChosen = document.getElementById('file-chosen');


  selecttheFiles.addEventListener('change', function () {
    fileChosen.textContent = this.files[0].name
  })

</script>
