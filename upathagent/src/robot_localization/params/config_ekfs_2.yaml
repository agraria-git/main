ekf_se_map:
  frequency: 30
  sensor_timeout: 0.1
  two_d_mode: true
  transform_time_offset: 0.0
  transform_timeout: 0.0
  print_diagnostics: true
  debug: false
  debug_out_file: /home/nvidia/se_map.txt

  map_frame: map
  odom_frame: odom
  base_link_frame: base_link
  world_frame: odom

