# Wheel odometry:

  odom0: /odomScout
  odom0_config: [false, false, false,
                 false, false, false,
                 true,  true,  false,
                 false, false,  true,
                 false, false, false]
  odom0_queue_size: 2
  odom0_nodelay: false
  odom0_differential: false
  odom0_relative: false

# imu configure:

  imu0: /imu/data
  imu0_config: [false, false, false,
                false, false,  true,
                false, false, false,
                false, false,  true,
                false, false, false]
  imu0_nodelay: false
  imu0_differential: false
  imu0_relative: false
  imu0_queue_size: 2
  imu0_remove_gravitational_acceleration: true

# pose configure:

  pose0: /pose/gps
